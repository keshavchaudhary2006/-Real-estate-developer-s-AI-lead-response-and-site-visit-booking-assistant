services:
  # Node.js Express Backend Service
  - type: web
    name: keshav-backend
    runtime: node
    plan: free
    region: oregon # or frankfurt, singapore, etc.
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
